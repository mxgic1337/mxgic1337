<section>
  <h2 class="section-title">
    <span class="icon"></span> Skills
  </h2>
  <div class="skills">
    {% for skill in skills %}
    <div class="skill" data-skill="{{ skill.name | lower }}">
      <div>
      <p>
        <span class="icon">
          <script>addIconCharacter('{{ skill.name | lower }}')</script>
        </span> {{ skill.name }}
      </p>
      <p class="time">...</p>
      </div>
      <div style="display: flex;" class="tools">
        {% if skill.tools %}
          {% for tool in skill.tools %}
          <span class="icon-link" data-tool="{{ tool | lower }}">
            <script>addIconCharacter('{{ tool | lower }}')</script>
          </span>
          {% endfor %}
        {% endif %}
        {% if skill.learning %}
           <span class="icon-link learning" title="Learning"></span>
        {% endif %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
